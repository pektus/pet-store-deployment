# ==============================================================================
# Production Configuration: ${APP_CONFIG_DIR}/apps/conf/application.properties
# Handled via ExternalConfigLoader & ExternalConfigApplicationContextInitializer
# ==============================================================================

# Database Connection (HikariCP / PostgreSQL)
# In Docker compose, database container hostname is 'db' on petstore-net
db.url=${JDBC_DATABASE_URL:jdbc:postgresql://db:5432/petstoredb}
db.username=${JDBC_DATABASE_USERNAME:postgres}
db.password=${JDBC_DATABASE_PASSWORD:postgres}
db.driver-class-name=org.postgresql.Driver
db.pool.max-size=15
db.pool.min-idle=5
db.pool.connection-timeout=30000
db.pool.idle-timeout=600000
db.pool.max-lifetime=1800000

# Hibernate ORM Settings
hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
hibernate.show_sql=false
hibernate.format_sql=false
hibernate.hbm2ddl.auto=validate

# Flyway Database Migration
flyway.locations=classpath:db/migration
flyway.baseline-on-migrate=true

# Security & JWT Configuration (HMAC-SHA256 Secret)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=86400000
jwt.issuer=PetStoreApp

# Local Filesystem Storage for Pet Photos (Mounted to uploads_data volume at /uploads)
app.storage.upload-dir=${APP_STORAGE_UPLOAD_DIR:/uploads}

# CORS Allowed Origins
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://192.168.1.235,http://localhost}