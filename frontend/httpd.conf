# ==============================================================================
# Apache HTTP Server 2.4 Configuration for Pet Store Frontend & Reverse Proxy
# ==============================================================================

ServerRoot "/usr/local/apache2"
Listen 80

# Essential Modules
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authn_file_module modules/mod_authn_file.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule authz_groupfile_module modules/mod_authz_groupfile.so
LoadModule authz_user_module modules/mod_authz_user.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule access_compat_module modules/mod_access_compat.so
LoadModule auth_basic_module modules/mod_auth_basic.so
LoadModule reqtimeout_module modules/mod_reqtimeout.so
LoadModule filter_module modules/mod_filter.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule env_module modules/mod_env.so
LoadModule headers_module modules/mod_headers.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule version_module modules/mod_version.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule deflate_module modules/mod_deflate.so
LoadModule dir_module modules/mod_dir.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule status_module modules/mod_status.so

<IfModule unixd_module>
    User daemon
    Group daemon
</IfModule>

ServerAdmin admin@petstore.local
ServerName 192.168.1.235:80

# Deny access to the entire filesystem by default
<Directory />
    AllowOverride none
    Require all denied
</Directory>

# Document Root - Angular Static Client SPA
DocumentRoot "/usr/local/apache2/htdocs"
<Directory "/usr/local/apache2/htdocs">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted

    # Angular HTML5 Single Page Application (pushState) Rewrites
    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteBase /

        # Do NOT rewrite API calls; let ProxyPass handle them
        RewriteRule ^api(/.*)?$ - [L]

        # If the requested file or directory exists, serve it directly
        RewriteCond %{REQUEST_FILENAME} -f [OR]
        RewriteCond %{REQUEST_FILENAME} -d
        RewriteRule ^ - [L]

        # For all other routes, rewrite to index.html for Angular router
        RewriteRule ^ index.html [L]
    </IfModule>
</Directory>

# Set default directory index
<IfModule dir_module>
    DirectoryIndex index.html
</IfModule>

# Prevent access to hidden files (.git, .htaccess, etc.)
<Files ".ht*">
    Require all denied
</Files>

# Logging Configuration
ErrorLog /proc/self/fd/2
LogLevel warn

<IfModule log_config_module>
    LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
    LogFormat "%h %l %u %t \"%r\" %>s %b" common
    CustomLog /proc/self/fd/1 combined
</IfModule>

# MIME Types Configuration
<IfModule mime_module>
    TypesConfig conf/mime.types
    AddType application/x-compress .Z
    AddType application/x-gzip .gz .tgz
    AddType application/javascript .js .mjs
    AddType text/css .css
    AddType image/svg+xml .svg .svgz
    AddType application/json .json
    AddType font/woff .woff
    AddType font/woff2 .woff2
</IfModule>

# Compression / Gzip for Frontend Assets
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css
    AddOutputFilterByType DEFLATE application/javascript application/json application/xml
    AddOutputFilterByType DEFLATE image/svg+xml font/woff font/woff2
</IfModule>

# ==============================================================================
# Reverse Proxy Configuration (Proxies /api/* to Tomcat Backend container)
# ==============================================================================
<IfModule mod_proxy.c>
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 60

    # Forward original client headers to Tomcat
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    # Forward /api requests to Apache Tomcat backend container on port 8080
    ProxyPass /api/ http://backend:8080/api/ retry=0 timeout=60
    ProxyPassReverse /api/ http://backend:8080/api/

    ProxyPass /api http://backend:8080/api retry=0 timeout=60
    ProxyPassReverse /api http://backend:8080/api
</IfModule>
